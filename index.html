
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightning BOOKTAG Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;700;900&family=Bungee&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background-color: white !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        @page {
          size: A4;
          margin: 0;
        }
      }
      .a4-page {
        width: 210mm;
        min-height: 297mm;
        background: white;
        margin: auto;
        box-shadow: 0 0 30px rgba(0,0,0,0.05);
        padding: 10mm;
        box-sizing: border-box;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .sticker-shadow {
        box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
      }
      .neo-button {
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        transition: all 0.1s ease;
      }
      .neo-button:active {
        box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        transform: translate(4px, 4px);
      }
    </style>
  <script type="importmap">

  }
}
</script>
</head>
